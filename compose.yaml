name: gym-occupancy

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:?Nustatykite SQL_PASSWORD faile .env}"
      MSSQL_PID: "Developer"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: "gym"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Nustatykite RABBITMQ_PASSWORD faile .env}"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./GymOccupancy
    environment:
      ConnectionStrings__GymDb: "Server=sqlserver;Database=GymOccupancyDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_USER: "gym"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      TZ: "Europe/Vilnius"
    ports:
      - "5227:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    build: ./gym-occupancy-web
    environment:
      API_URL: "http://api:8080"
    ports:
      - "5173:5173"
    depends_on:
      - api

  scanner:
    build: ./ScannerSimulator
    environment:
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_USER: "gym"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      TZ: "Europe/Vilnius"
    stdin_open: true
    tty: true
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  sql-data:
  rabbit-data: